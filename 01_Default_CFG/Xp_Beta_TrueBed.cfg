## Xplorer beta: true-zero Y for IMEX
##
## Moves the machine to a Y origin of zero and a printable area of 400 x 342.5,
## which is what the Vivedino Xplorer profiles in OrcaSlicer PR #13086 expect.
## IMEX splits the bed into equal zones measured from the origin, so the 57.5 mm
## the stock configuration carries between the two gantries cannot survive: the
## zones stop dividing evenly and every cross-gantry mode inherits the error.
##
## ---------------------------------------------------------------------------
## REQUIRES PR #19 (the gantry0 seat read from a variable), and PR #17 as well
## on a Dual Gantry. Without #19 the seats stay written into the macro bodies at
## 400 while y_cop_dg below moves, which is worse than either setting alone.
## Check that Xp_Xplorer_Vars.cfg defines variable_y_seat_g0 before including
## this file.
## ---------------------------------------------------------------------------
##
## Include AFTER the stock config in printer.cfg, so these win:
##
##     [include ./0_Xplorer/01_Default_CFG/Xplorer_V1.1_IQEX.cfg]
##     [include Xp_Beta_TrueBed.cfg]
##
## Remove that line to go back. No shipped file is edited; anything not named
## here keeps its stock value. Requires Xplorer_UpdateManager PR #19, and PR #17
## as well on a Dual Gantry.
##
## AFTER SWITCHING, RE-RUN THE TOOL OFFSET CALIBRATION. Offsets stored under the
## stock configuration carry the 57.5 and are wrong here.

## --- Re-datum gantry0 so both gantries share one origin -------------------
## The stock endstop sits 57.5 further back than gantry1's, which is where the
## compensation came from. Homing 57.5 lower removes the difference at source.
[carriage gantry0]
position_endstop: 391.5
position_max: 392
position_min: 77.5        # how close the rear gantry gets to a parked gantry1

[dual_carriage gantry1]
position_max: 392         # matches gantry0's new ceiling

## --- Nothing adds the offset back ----------------------------------------
[gcode_macro _XPLORER_VARIABLES]
variable_y_off_dg:    0      # was 57.5; applied to gantry1 tools and added back
                             # when storing offsets. With the axis re-datumed
                             # there is no difference left to compensate for.

## Seats, all corners of the 342.5 mm printable area.
variable_y_seat_g0:   342.5  # gantry0: rear edge of the rear zone
variable_y_cop_dg:    171.25 # gantry1 in COPY: rear edge of the front zone
variable_y_mir_dg:    0      # gantry1 in MIRROR: reflected about the midline

## Absolute Y positions, moved with the datum.
variable_calp_y:      348    # stock 406
variable_yrest1:      352    # stock 410. yrest2 (IQEX) is left alone: it is a
                             # park preference, not geometry, and stock 0 is
                             # still valid and clear of a parked gantry0.
